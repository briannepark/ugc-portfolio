name: Deploy to Windmill

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate embedded HTML pages from /site
        run: node scripts/build-app.mjs

      - name: Install Windmill CLI
        run: npm install -g windmill-cli

      - name: Deploy Raw App to Windmill
        run: |
          wmill sync push \
            --base-url "${{ secrets.WM_BASE_URL }}" \
            --workspace "${{ secrets.WM_WORKSPACE }}" \
            --token "${{ secrets.WM_TOKEN }}" \
            --yes
