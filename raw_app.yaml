# Windmill Raw App config — see https://www.windmill.dev/docs/full_code_apps/deployment
#
# `path` is the app's location inside your Windmill workspace. The default below
# assumes a Windmill username "briannepark" — if your workspace uses a different
# username/folder, update this before the first deploy (wmill will create the app
# at this path the first time `wmill sync push` runs).
summary: "Brianne — UGC Portfolio"
path: "u/briannepark/ugc_portfolio"

# Friendly URL segment: https://app.windmill.dev/api/w/<workspace>/apps_u/public/<custom_path>
custom_path: "ugc-portfolio"

# Anyone with the link can view it — no Windmill login required. Set to false if
# you'd rather it only be visible to people in your Windmill workspace.
public: true
